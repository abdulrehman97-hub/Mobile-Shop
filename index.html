<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Karam Mobiles - Stock & Sales System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --success: #059669; --danger: #dc2626; --warning: #d97706; --dark: #0f172a; --light: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--light); color: var(--dark); padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { font-size: 20px; text-align: center; margin-bottom: 20px; color: var(--primary); }
        .section { margin-bottom: 25px; padding: 15px; background: #f1f5f9; border-radius: 8px; }
        .section h2 { font-size: 15px; margin-bottom: 10px; color: #334155; }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 3px; }
        .form-control { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px; width: 100%; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 5px; }
        .btn-success { background: var(--success); }
        .btn-warning { background: var(--warning); color: white; }
        .btn-danger { background: var(--danger); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        table, th, td { border: 1px solid #cbd5e1; }
        th, td { padding: 8px; text-align: center; }
        th { background: #e2e8f0; }
        .stats-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-card { flex: 1; background: #e0f2fe; padding: 12px; border-radius: 8px; text-align: center; }
        .stat-card h3 { font-size: 13px; color: #0369a1; }
        .stat-card p { font-size: 18px; font-weight: 700; color: #0284c7; }
        .action-btns { display: flex; gap: 4px; justify-content: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📱 Al-Karam Stock & Sales Manager</h1>

        <!-- ڈیش بورڈ (منافع اور سیل کی سمری بمعہ پاسورڈ لاک) -->
        <div class="stats-box">
            <div class="stat-card">
                <h3>Total Sales</h3>
                <p id="total-sales">****</p>
            </div>
            <div class="stat-card" style="background: #d1fae5;">
                <h3 style="color: #065f46;">Total Profit</h3>
                <p id="total-profit" style="color: #047857;">****</p>
            </div>
        </div>
        <div style="text-align: center; margin-bottom: 20px;">
            <button class="btn" style="width: auto; padding: 6px 15px; font-size: 12px;" onclick="unlockStats()">Unlock Stats (Code)</button>
        </div>

        <!-- 1. نیا پروڈکٹ یا اسٹاک ایڈ کرنے کا فارم -->
        <div class="section">
            <h2>📦 Add New Item to Stock</h2>
            <div class="input-group">
                <label>Item Name:</label>
                <input type="text" id="item-name" class="form-control" placeholder="e.g. AirPods Pro 2">
            </div>
            <div class="input-group">
                <label>Quantity Available:</label>
                <input type="number" id="item-qty" class="form-control" placeholder="e.g. 10">
            </div>
            <div class="input-group">
                <label>Cost Price (خرچہ):</label>
                <input type="number" id="item-cost" class="form-control" placeholder="e.g. 500">
            </div>
            <div class="input-group">
                <label>Selling Price (فروخت قیمت):</label>
                <input type="number" id="item-price" class="form-control" placeholder="e.g. 650">
            </div>
            <button class="btn" onclick="addStock()">Add to Stock</button>
        </div>

        <!-- 2. اسٹاک کی لسٹ، سیل اور ایڈٹ کرنے کا سیکشن -->
        <div class="section">
            <h2>🛒 Available Stock, Sell & Edit</h2>
            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Qty</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="stock-table-body">
                    <!-- یہاں اسٹاک شو ہوگا -->
                </tbody>
            </table>
        </div>

        <!-- 3. سیلز ہسٹری -->
        <div class="section">
            <h2>📜 Sales History</h2>
            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Sold Qty</th>
                        <th>Profit</th>
                    </tr>
                </thead>
                <tbody id="sales-table-body">
                    <!-- یہاں بکی ہوئی چیزیں آئیں گی -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let stock = JSON.parse(localStorage.getItem('shop_stock')) || [];
        let sales = JSON.parse(localStorage.getItem('shop_sales')) || [];
        let isUnlocked = false;

        function saveData() {
            localStorage.setItem('shop_stock', JSON.stringify(stock));
            localStorage.setItem('shop_sales', JSON.stringify(sales));
        }

        function unlockStats() {
            let code = prompt("Enter Security Code:");
            if (code === "P.AK.123") {
                isUnlocked = true;
                renderTables();
                alert("Stats unlocked successfully!");
            } else {
                alert("Incorrect Code!");
            }
        }

        function addStock() {
            let name = document.getElementById('item-name').value.trim();
            let qty = parseInt(document.getElementById('item-qty').value);
            let cost = parseFloat(document.getElementById('item-cost').value);
            let price = parseFloat(document.getElementById('item-price').value);

            if(!name || isNaN(qty) || isNaN(cost) || isNaN(price)) {
                alert("Please fill all fields correctly!");
                return;
            }

            stock.push({ id: Date.now(), name, qty, cost, price });
            saveData();
            renderTables();

            document.getElementById('item-name').value = '';
            document.getElementById('item-qty').value = '';
            document.getElementById('item-cost').value = '';
            document.getElementById('item-price').value = '';
        }

        function sellItem(index) {
            let sellQty = prompt("Enter quantity to sell:", "1");
            if(!sellQty) return;
            sellQty = parseInt(sellQty);

            if(isNaN(sellQty) || sellQty <= 0) {
                alert("Invalid quantity!");
                return;
            }

            if(sellQty > stock[index].qty) {
                alert("Not enough stock available!");
                return;
            }

            let item = stock[index];
            item.qty -= sellQty;

            let itemSales = sellQty * item.price;
            let itemProfit = sellQty * (item.price - item.cost);

            sales.push({ name: item.name, qty: sellQty, profit: itemProfit, total: itemSales });

            if(item.qty === 0) {
                stock.splice(index, 1);
            }

            saveData();
            renderTables();
        }

        function editItem(index) {
            let item = stock[index];
            let newName = prompt("Edit Item Name:", item.name);
            if(newName === null) return;
            
            let newQty = prompt("Edit Quantity:", item.qty);
            if(newQty === null) return;

            let newCost = prompt("Edit Cost Price:", item.cost);
            if(newCost === null) return;

            let newPrice = prompt("Edit Selling Price:", item.price);
            if(newPrice === null) return;

            newQty = parseInt(newQty);
            newCost = parseFloat(newCost);
            newPrice = parseFloat(newPrice);

            if(!newName || isNaN(newQty) || isNaN(newCost) || isNaN(newPrice)) {
                alert("Invalid input values!");
                return;
            }

            stock[index] = { ...item, name: newName, qty: newQty, cost: newCost, price: newPrice };
            saveData();
            renderTables();
        }

        function renderTables() {
            let stockHtml = '';
            let totalSalesAmount = 0;
            let totalProfitAmount = 0;

            stock.forEach((item, index) => {
                stockHtml += `
                    <tr>
                        <td>${item.name}</td>
                        <td>${item.qty}</td>
                        <td>Rs. ${item.price}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn btn-success" style="padding: 3px 6px; font-size: 10px; margin-top:0;" onclick="sellItem(${index})">Sell</button>
                                <button class="btn btn-warning" style="padding: 3px 6px; font-size: 10px; margin-top:0;" onclick="editItem(${index})">Edit</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            document.getElementById('stock-table-body').innerHTML = stockHtml;

            let salesHtml = '';
            sales.forEach(s => {
                totalSalesAmount += s.total;
                totalProfitAmount += s.profit;
                salesHtml += `
                    <tr>
                        <td>${s.name}</td>
                        <td>${s.qty}</td>
                        <td style="color: #059669; font-weight: 600;">Rs. ${s.profit}</td>
                    </tr>
                `;
            });
            document.getElementById('sales-table-body').innerHTML = salesHtml;

            if (isUnlocked) {
                document.getElementById('total-sales').innerText = `Rs. ${totalSalesAmount}`;
                document.getElementById('total-profit').innerText = `Rs. ${totalProfitAmount}`;
            } else {
                document.getElementById('total-sales').innerText = `****`;
                document.getElementById('total-profit').innerText = `****`;
            }
        }

        renderTables();
    </script>
</body>
</html>
